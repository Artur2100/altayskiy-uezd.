name: Cloud AI team CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cloud SDK
        run: pip install -r requirements-cloud-ai.txt
      - name: Compile
        run: python -m py_compile scripts/cloud_ai_team.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
