name: Daily AI team report

on:
  schedule:
    # 09:15 Asia/Barnaul (UTC+7) = 02:15 UTC
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ai-team-report
  cancel-in-progress: false

jobs:
  offline-team-report:
    name: Run nine offline specialist agents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python scripts
        run: python -m py_compile scripts/ai_team.py scripts/site_audit.py scripts/send_telegram.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run static site audit
        run: python scripts/site_audit.py

      - name: Run nine offline specialist agents
        run: python scripts/ai_team.py

      - name: Send report to Telegram when configured
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py

      - name: Upload Markdown and JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-team-report-${{ github.run_number }}
          path: |
            reports/daily-ai-report-*.md
            reports/daily-ai-report-*.json
          if-no-files-found: warn
          retention-days: 30
