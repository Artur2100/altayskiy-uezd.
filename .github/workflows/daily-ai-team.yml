name: Daily AI team report

on:
  schedule:
    # 09:15 Asia/Barnaul (UTC+7) = 02:15 UTC
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ai-team-report
  cancel-in-progress: false

jobs:
  ai-report:
    name: Run specialist agents and build report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run static site audit
        run: python scripts/site_audit.py

      - name: Validate Python runtime syntax
        run: python -m py_compile scripts/ai_team.py scripts/site_audit.py scripts/send_telegram.py

      - name: Run AI specialist agents
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPEN_AI_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/ai_team.py

      - name: Send AI report to Telegram when configured
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py

      - name: Upload AI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-team-report-${{ github.run_number }}
          path: reports/daily-ai-report-*.md
          if-no-files-found: warn
          retention-days: 30
