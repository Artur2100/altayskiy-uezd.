name: Daily AI team report

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ai-team-report
  cancel-in-progress: false

jobs:
  ai-report:
    name: Run free-tier AI review and build report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run static site audit
        run: python scripts/site_audit.py
      - name: Validate Python runtime syntax
        run: python -m py_compile scripts/ai_team.py scripts/site_audit.py scripts/send_telegram.py
      - name: Run AI specialist team (Cloudflare Workers AI Free)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL }}
        run: python scripts/ai_team.py
      - name: Send report to Telegram when configured
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py
      - name: Upload AI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-team-report-${{ github.run_number }}
          path: reports/daily-ai-report-*.md
          if-no-files-found: warn
          retention-days: 30
