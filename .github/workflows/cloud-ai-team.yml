name: Cloud AI team

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-ai-team
  cancel-in-progress: false

jobs:
  nine-cloud-agents:
    if: github.repository == 'Artur2100/altayskiy-uezd.'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned-range SDK
        run: pip install -r requirements-cloud-ai.txt
      - name: Compile and test
        run: |
          python -m py_compile scripts/cloud_ai_team.py
          python -m unittest discover -s tests -v
      - name: Run exactly nine cloud LLM specialists
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: python scripts/cloud_ai_team.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-ai-team-${{ github.run_number }}
          path: |
            reports/cloud-ai-team-*.md
            reports/cloud-ai-team-*.json
          if-no-files-found: warn
          retention-days: 30
