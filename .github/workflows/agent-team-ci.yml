name: AI team capability tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile agent tools
        run: python -m py_compile scripts/ai_team.py scripts/site_audit.py scripts/competitor_research.py scripts/local_agent_team.py scripts/send_telegram.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
