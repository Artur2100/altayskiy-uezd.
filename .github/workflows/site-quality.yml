name: Site quality audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-audit:
    name: Static HTML structure audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Python scripts
        run: python -m py_compile scripts/site_audit.py scripts/ai_team.py

      - name: Run dependency-free site audit
        run: python scripts/site_audit.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: site-audit-report.json
          if-no-files-found: warn
